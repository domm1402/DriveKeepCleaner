name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller send2trash
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name DriveKeepCleaner DriveKeepCleaner.py
      - uses: actions/upload-artifact@v4
        with:
          name: DriveKeepCleaner-Windows-EXE
          path: dist/DriveKeepCleaner.exe
